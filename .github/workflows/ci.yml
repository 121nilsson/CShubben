name: CI

# Bygger appen vid varje push och PR. WinUI 3 kräver Windows-runner och explicit plattform.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# En ny push avbryter den pågående körningen för samma gren.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: NuGet-cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Cshubben.slnx -p:Platform=${{ matrix.platform }}

      # Bygg alltid med explicit plattform, annars ger WindowsAppSDKSelfContained fel.
      - name: Build
        run: dotnet build Cshubben.slnx -c Release --no-restore -p:Platform=${{ matrix.platform }}

      - name: Publish
        run: dotnet publish src/Cshubben/Cshubben.csproj -c Release -p:Platform=${{ matrix.platform }} -o publish/${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: cshubben-win-${{ matrix.platform }}
          path: publish/${{ matrix.platform }}
          if-no-files-found: error
