name: CI

# Core tests on Linux, the WinUI app on Windows (it needs a Windows runner and an explicit platform),
# plus screenshots of every page with demo data so the design can be reviewed from the artifacts.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

# A new push cancels the in-progress run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only read. Only publish-screenshots overrides this with contents: write.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test tests/Cshubben.Core.Tests -c Release

  app:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # ARM64 is only built on manual runs and tags to keep push feedback fast.
        platform: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["x64","ARM64"]') || fromJSON('["x64"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Restore
        run: dotnet restore src/Cshubben/Cshubben.csproj -p:Platform=${{ matrix.platform }}

      # Always build with an explicit platform, otherwise WindowsAppSDKSelfContained fails.
      - name: Publish
        run: dotnet publish src/Cshubben/Cshubben.csproj -c Release --no-restore -p:Platform=${{ matrix.platform }} -o publish/${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: cshubben-win-${{ matrix.platform }}
          path: publish/${{ matrix.platform }}
          if-no-files-found: error

  # Screenshots run as parallel shards (each one starts the app once per picture, which is the slow part).
  screenshots:
    needs: app
    # Still take screenshots when only the manual ARM64 leg failed; download-artifact fails if x64 is missing.
    if: ${{ !cancelled() && (needs.app.result == 'success' || needs.app.result == 'failure') }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            shots: "overview;overview --select a1;feed;mine --select a3;reviews --select r3;drift;linear;notes;stats;settings;notes --select n-decision;notes --select n-links;review --select a1;overview --select a1 --tab 1;overview --select a1 --tab 3;overview --palette;review --select a1 --file payments.ts @1000x760"
          - shard: 2
            shots: "overview @1000x760;overview --select a1 @1000x760;reviews --select r3 @1000x760;notes @1000x760;notes --select n-decision @1000x760;review --select a1 @1000x760;linear @1000x760;stats @1000x760;settings @1000x760;overview @640x900;overview --select a1 @640x900;overview --select a1 --tab 1 @640x900;drift @1000x760;feed @1000x760;overview --palette pay @1000x560"
          - shard: 3
            shots: "reviews @640x900;notes @640x900;notes --select n-decision @640x900;review --select a1 @640x900;linear @640x900;stats @640x900;settings @640x900;review --select a1 @1920x1080;linear @1920x1080;stats @1920x1080;linear --issue API-231 @1920x1080;overview @1920x1080;overview --select a1 @1920x1080;overview --select a1 --tab 3 @640x900;drift @640x900;feed @640x900"
          - shard: 4
            shots: "overview --theme dark;overview --select a1 --theme dark;review --select a1 --theme dark;review --select a1 --file payments.ts --theme dark @1000x760;feed --theme dark;settings --theme dark;linear --theme dark;notes --theme dark;drift --theme dark;stats --theme dark;overview --palette --theme dark"
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v8
        with:
          name: cshubben-win-x64
          path: publish/x64

      - name: Screenshots
        continue-on-error: true
        shell: pwsh
        env:
          SHOTS: ${{ matrix.shots }}
        run: ./scripts/screenshot.ps1 -Exe publish/x64/Cshubben.exe -OutDir shots -Shots $env:SHOTS

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.shard }}
          path: shots
          if-no-files-found: warn

  # The sandbox that Claude works in cannot download Actions artifacts, but it can fetch git branches.
  # So the latest screenshots are also force-pushed to an orphan branch (no history, no CI trigger).
  publish-screenshots:
    needs: screenshots
    if: always() && github.event_name == 'push' && needs.screenshots.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: shots

      - name: Publish screenshots to branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] && [ "$(ls -A shots)" ] || { echo "no shots"; exit 0; }
          printf 'commit %s\n%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > shots/SOURCE.txt
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-screenshots
