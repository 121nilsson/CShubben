name: CI

# Core tests on Linux, the WinUI app on Windows (it needs a Windows runner and an explicit platform),
# plus screenshots of every page with demo data so the design can be reviewed from the artifacts.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

# A new push cancels the in-progress run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/Cshubben.Core.Tests -c Release

  app:
    runs-on: windows-latest
    permissions:
      contents: write   # to publish screenshots to the ci-screenshots branch
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/Cshubben/Cshubben.csproj -p:Platform=${{ matrix.platform }}

      # Always build with an explicit platform, otherwise WindowsAppSDKSelfContained fails.
      - name: Publish
        run: dotnet publish src/Cshubben/Cshubben.csproj -c Release --no-restore -p:Platform=${{ matrix.platform }} -o publish/${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: cshubben-win-${{ matrix.platform }}
          path: publish/${{ matrix.platform }}
          if-no-files-found: error

      # Screenshots only make sense on the x64 runner (the ARM64 build cannot run there).
      - name: Screenshots
        if: matrix.platform == 'x64'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/screenshot.ps1 -Exe publish/x64/Cshubben.exe -OutDir shots -Shots "overview;overview --select a1;feed;mine --select a3;reviews --select r3;drift;linear;notes;stats;settings;overview @1000x760;overview --select a1 @1000x760;reviews --select r3 @1000x760;notes @1000x760;overview @640x900;overview --select a1 @640x900;reviews @640x900;notes @640x900;overview @1920x1080;overview --select a1 @1920x1080"

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'x64' && always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: warn

      # The sandbox that Claude works in cannot download Actions artifacts, but it can fetch git branches.
      # So the latest screenshots are also force-pushed to an orphan branch (no history, no CI trigger).
      - name: Publish screenshots to branch
        if: matrix.platform == 'x64' && github.event_name == 'push' && always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path shots)) { Write-Host "no shots"; exit 0 }
          $tmp = Join-Path $env:RUNNER_TEMP "shots-repo"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item shots/* $tmp
          "commit $env:GITHUB_SHA`n$(Get-Date -Format o)" | Set-Content (Join-Path $tmp "SOURCE.txt")
          Push-Location $tmp
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for $env:GITHUB_SHA"
          git push -f "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" HEAD:refs/heads/ci-screenshots
          Pop-Location
