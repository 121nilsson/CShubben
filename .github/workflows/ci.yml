name: CI

# Core tests on Linux, the WinUI app on Windows (it needs a Windows runner and an explicit platform),
# plus screenshots of every page with demo data so the design can be reviewed from the artifacts.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

# A new push cancels the in-progress run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/Cshubben.Core.Tests -c Release

  app:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/Cshubben/Cshubben.csproj -p:Platform=${{ matrix.platform }}

      # Always build with an explicit platform, otherwise WindowsAppSDKSelfContained fails.
      - name: Publish
        run: dotnet publish src/Cshubben/Cshubben.csproj -c Release --no-restore -p:Platform=${{ matrix.platform }} -o publish/${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: cshubben-win-${{ matrix.platform }}
          path: publish/${{ matrix.platform }}
          if-no-files-found: error

      # Screenshots only make sense on the x64 runner (the ARM64 build cannot run there).
      - name: Screenshots
        if: matrix.platform == 'x64'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/screenshot.ps1 -Exe publish/x64/Cshubben.exe -OutDir shots

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'x64' && always()
        with:
          name: screenshots
          path: shots
          if-no-files-found: warn
